# Builds the Android phone app and the Pixel Watch (Wear OS) app, and publishes both on the Releases page.
# Runs whenever the app's code changes on main, or by hand: Actions tab → Build Android app → Run workflow.
# Latest APK is always at:
#   https://github.com/davanlind/FF-DaveTracker/releases/latest/download/FF-Tracker.apk        (phone)
#   https://github.com/davanlind/FF-DaveTracker/releases/latest/download/FF-Tracker-Watch.apk  (watch)
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'css/**'
      - 'js/**'
      - 'icons/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # needed to publish the Release

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the APKs (phone + watch)
        working-directory: android
        run: ./gradlew :app:assembleRelease :wear:assembleRelease --no-daemon --stacktrace

      - name: Name the APKs
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk FF-Tracker.apk
          cp android/wear/build/outputs/apk/release/wear-release.apk FF-Tracker-Watch.apk

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v4
        with:
          name: FF-Tracker-apks
          path: |
            FF-Tracker.apk
            FF-Tracker-Watch.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0.${{ github.run_number }}
          name: F&F Tracker for Android 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            FF-Tracker.apk
            FF-Tracker-Watch.apk
          body: |
            **FF-Tracker.apk**: phone app. Download on your Android phone and open it to install or update.
            **FF-Tracker-Watch.apk**: Pixel Watch app. See docs/WATCH_APP.md for how to put it on the watch.
            Updating keeps your data. Built from commit ${{ github.sha }}.
